<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Yeshua Jiu-Jitsu com Cristo">
  <defs>
    <path id="arcoTopo" d="M 100,100 m -80,0 a 80,80 0 0 1 160,0" />
    <path id="arcoBase" d="M 100,100 m -80,0 a 80,80 0 0 0 160,0" />
  </defs>

  <!-- anel externo -->
  <circle cx="100" cy="100" r="99" fill="#ffffff" />
  <circle cx="100" cy="100" r="97.5" fill="none" stroke="#111111" stroke-width="2.5" />
  <circle cx="100" cy="100" r="93" fill="#111111" />
  <circle cx="100" cy="100" r="72.5" fill="#ffffff" />
  <circle cx="100" cy="100" r="70" fill="none" stroke="#111111" stroke-width="3" />

  <!-- texto do anel -->
  <g fill="#ffffff" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-weight="700">
    <text font-size="23" letter-spacing="5.5">
      <textPath href="#arcoTopo" startOffset="50%" text-anchor="middle">YESHUA</textPath>
    </text>
    <text font-size="15.5" letter-spacing="2.6">
      <textPath href="#arcoBase" startOffset="50%" text-anchor="middle" side="right">JIU-JITSU COM CRISTO</textPath>
    </text>
  </g>

  <!-- cruz -->
  <g fill="#8b5e34">
    <path d="M91.5 34.5 h17.5 l1.2 62 l-1.6 68 h-16.4 l-1.5-67 z" />
    <path d="M43 76.5 l114 -1.8 l1.6 18.6 l-115.4 1.2 z" />
  </g>

  <!-- faixa preta cruzada -->
  <g fill="none" stroke="#111111" stroke-width="17" stroke-linecap="round">
    <path d="M70 50 C 128 92, 74 112, 128 160" />
    <path d="M130 50 C 72 92, 126 112, 72 160" />
  </g>
  <!-- ponta vermelha da faixa -->
  <path d="M72 160 L 86 148" fill="none" stroke="#c1121f" stroke-width="17" stroke-linecap="round" />
  <path d="M84 150 L 90 145" fill="none" stroke="#111111" stroke-width="17" stroke-linecap="round" />
</svg>
